    <#F4D03F>==== Contract ====
    <#FFE066>/contract <#F1F5F9>- Open the board
    <#FFE066>/contract service \<reward|item> \<days> \<title>|\<description> <#F1F5F9>- Post a service contract; item escrows the main-hand item as reward
    <#CFD8DC>Batch: <#FFE066>/contract service \<reward|item> \<days> --count \<amount> --repeat \<unlimited|once|cooldown> [--cooldown \<hours>] \<title>|\<description>
    <#CFD8DC>Optional: <#FFE066>--mediator \<player>
    <#CFD8DC>System verified: <#FFE066>/contract service \<reward|item> \<days> --objective \<type> \<target> \<amount> \<title>|\<description>
    <#CFD8DC>Objective types: <#FFE066>craft_item/block_break/fish/block_place/kill_entity/kill_player/consume_item/deliver_item/deliver_money/enchant_item/shear/breed/tame/chat/block_interact/run_command/use_item
    <#FFE066>/contract wager \<opponent> \<stake> \<days> \<arbiter> \<title>|\<description> <#F1F5F9>- Open a wager
    <#FFE066>/contract partner \<partner> \<my stake> \<their stake> \<days> \<title>|\<description> <#F1F5F9>- Invite a partner
    <#CFD8DC>Optional: <#FFE066>/contract partner \<partner> \<my stake> \<their stake> \<days> --mediator \<player> \<title>|\<description>
    <#FFE066>/contract sale \<buyer> \<price> \<days> \<title>|\<description> <#F1F5F9>- Preview and sign a main-hand item sale
    <#FFE066>/contract resolve \<id> \<a|b> <#F1F5F9>- Arbiter resolves a wager
    <#FFE066>/contract mediate \<id> \<accept|pay|refund|owner|contractor> <#F1F5F9>- Mediator accepts duties or resolves
    <#FFE066>/contract list [page] <#F1F5F9>- List open service contracts
    <#FFE066>/contract my <#F1F5F9>- List contracts related to you
    <#FFE066>/contract rep [player] <#F1F5F9>- View a player's track record
    <#FFE066>/contract info \<id> <#F1F5F9>- Show details
    <#FFE066>/contract accept \<id> <#F1F5F9>- Accept a contract or invite
    <#FFE066>/contract submit \<id> <#F1F5F9>- Submit completion or deliver objective items/money
    <#FFE066>/contract claim \<id> <#F1F5F9>- Claim stored delivery or reward items
    <#FFE066>/contract approve \<id> <#F1F5F9>- Approve payment or partnership completion
    <#FFE066>/contract cancel \<id> <#F1F5F9>- Cancel when allowed
    <#FFE066>/contract dispute \<id> \<reason> <#F1F5F9>- Open a dispute
    <#FFE066>/contract withdraw \<id> <#F1F5F9>- Withdraw a dispute you opened
