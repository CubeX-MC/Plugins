  info: |
    <#F4D03F>==== 合同 #<id> ====
    <#FFE066>标题: <#FFFFFF><title>
    <#FFE066>类型: <#FFFFFF><type>
    <#FFE066>状态: <#FFFFFF><status>
    <#FFE066>参与者:
    <participants>
    <arbiter>
    <#FFE066>托管/押注: <#69DB7C><reward>
    <#FFE066>结算预览:
    <payouts>
    <approval>
    <#FFE066>接单截止: <#FFFFFF><deadline>
    <#FFE066>描述: <#F1F5F9><description>
  help: |
    <#F4D03F>==== Contract ====
    <#FFE066>/contract <#F1F5F9>- 打开合同大厅
    <#FFE066>/contract service \<奖金|item> \<天> \<标题>|\<描述> <#F1F5F9>- 发布雇佣合同，item 表示托管主手物品作为奖励
    <#CFD8DC>批量: <#FFE066>/contract service \<奖金|item> \<天> --count \<份数> --repeat \<unlimited|once|cooldown> [--cooldown \<小时>] \<标题>|\<描述>
    <#CFD8DC>可选: <#FFE066>--mediator \<中间人>
    <#CFD8DC>系统验收: <#FFE066>/contract service \<奖金|item> \<天> --objective \<类型> \<目标> \<数量> \<标题>|\<描述>
    <#CFD8DC>目标类型: <#FFE066>craft_item/block_break/fish/block_place/kill_entity/kill_player/consume_item/deliver_item/deliver_money/enchant_item/shear/breed/tame/chat/block_interact/run_command/use_item
    <#FFE066>/contract wager \<对方> \<押注> \<天> \<仲裁> \<标题>|\<描述> <#F1F5F9>- 发起对赌
    <#FFE066>/contract partner \<对方> \<我押注> \<对方押注> \<天> \<标题>|\<描述> <#F1F5F9>- 发起合作
    <#CFD8DC>可选: <#FFE066>/contract partner \<对方> \<我押注> \<对方押注> \<天> --mediator \<中间人> \<标题>|\<描述>
    <#FFE066>/contract resolve \<id> \<a|b> <#F1F5F9>- 仲裁者裁决对赌
    <#FFE066>/contract mediate \<id> \<accept|pay|refund|owner|contractor> <#F1F5F9>- 中间人接受职责或裁决
    <#FFE066>/contract list [页码] <#F1F5F9>- 查看公开合同
    <#FFE066>/contract my <#F1F5F9>- 查看我的合同
    <#FFE066>/contract rep [玩家] <#F1F5F9>- 查看履约档案/信誉
    <#FFE066>/contract info \<id> <#F1F5F9>- 查看详情
    <#FFE066>/contract accept \<id> <#F1F5F9>- 接单
    <#FFE066>/contract submit \<id> <#F1F5F9>- 提交完成/交付系统物品或货币
    <#FFE066>/contract claim \<id> <#F1F5F9>- 领取合同暂存的交付物品或奖励物品
    <#FFE066>/contract approve \<id> <#F1F5F9>- 雇主确认并付款
    <#FFE066>/contract cancel \<id> <#F1F5F9>- 取消可取消的合同
    <#FFE066>/contract dispute \<id> \<原因> <#F1F5F9>- 发起争议
    <#FFE066>/contract withdraw \<id> <#F1F5F9>- 撤销你发起的争议
