lang-version: 5

prefix: "&#69DB7C[Regions] "
help: |
  &#69DB7C/regions gui &#CFD8DC- Open the Regions management GUI
  &#69DB7C/regions list &#CFD8DC- List regions
  &#69DB7C/regions create <id> <name> --land <land> [area] &#CFD8DC- Create a venue on your own Lands area
  &#69DB7C/regions bind <id> cuboid|lands ... &#CFD8DC- Bind a region source
  &#69DB7C/regions mode set <id> dual_pvp|union_war|run_race|boat_race|horse_race|hide_and_seek ... &#CFD8DC- Set gameplay mode
  &#69DB7C/regions game <id> ready/start/status/end &#CFD8DC- Ready, judge-start, inspect, or end a game
  &#69DB7C/regions flag set <id> <flag> <value> &#CFD8DC- Set a rule flag
  &#69DB7C/regions effect add <id> <effect> [args] &#CFD8DC- Add a scoped effect
  &#69DB7C/regions trial <id> [start|stop] &#CFD8DC- Isolate draft Effect and Flag testing to yourself
  &#69DB7C/regions preview <id> &#CFD8DC- Preview dependencies, conflicts, and effective rules
  &#69DB7C/regions validate [id] &#CFD8DC- Validate configuration
  &#69DB7C/regions inspect <player> &#CFD8DC- Inspect player region state
  &#69DB7C/regions cleanup <player> &#CFD8DC- Cleanup player region state
  &#69DB7C/regions freeze|unfreeze <id> [reason] &#CFD8DC- Freeze or review and unfreeze a venue as super-administrator
  &#69DB7C/regions audit [id] [limit] &#CFD8DC- View the audit log as super-administrator
  &#69DB7C/regions reload &#CFD8DC- Reload configuration
help-publishing: |
  &#69DB7C/regions publish|withdraw <id> &#CFD8DC- Publish a draft or withdraw the live revision
  &#69DB7C/regions history <id> &#CFD8DC- View the immutable revision history
  &#69DB7C/regions rollback <id> <revision> &#CFD8DC- Publish a historical revision as a new one
  &#69DB7C/regions archive <id> &#CFD8DC- Archive a venue
help-player: "&#CFD8DCWalk into a configured land or venue to experience Regions. Duel, race, and mini-game venues will prompt you to run &#69DB7C/regions game <venue> ready&#CFD8DC when confirmation is needed."
reloaded: "&#69DB7CRegions reloaded."
