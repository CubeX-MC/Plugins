authority-not-source-owner: "<#E63946>你不是该场地所绑定区域的当前主人。"
authority-source-unknown: "<#E63946>该场地的区域来源不存在。"
authority-source-unavailable: "<#E63946>该场地的区域来源当前不可用。"
authority-superadmin-required: "<#E63946>此操作仅限 Regions 超级管理员。"
authority-region-frozen: "<#E63946>该场地已冻结，仅 Regions 超级管理员可以处理。"
