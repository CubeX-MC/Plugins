name: StateCharge
version: ${project.version}
main: org.cubexmc.statecharge.StateChargePlugin
api-version: '1.21'
folia-supported: true
author: CubeX-MC
description: Paid timed player states (shrink, grow, fly) backed by Vault.
# Vault is required for the economy API; soft-depend on common providers so StateCharge enables
# AFTER the economy is registered (otherwise a load-order race can disable it until a reload).
depend: [Vault]
softdepend: [Essentials, CMI, EssentialsX]

commands:
  statecharge:
    description: Buy and manage timed player states.
    aliases: [sc]
    usage: /statecharge help

permissions:
  statecharge.use:
    description: Use the player commands (shop GUI, list, status, toggle, guard).
    default: true
  # 下面这些节点只有当某个状态的 config 里把 "permission" 指到它时才会被检查。
  # 交易页**只显示玩家有权限的状态**,所以这些默认给 true,免得服主一开检查就把所有人锁在外面。
  statecharge.state.small:
    description: Use the small state (checked only when configured on that state).
    default: true
  statecharge.state.giant:
    description: Use the giant state (checked only when configured on that state).
    default: true
  statecharge.state.fly:
    description: Use the fly state (checked only when configured on that state).
    default: true
  statecharge.fly.keep:
    description: Keep flight after the fly state is turned off.
    default: false
  statecharge.admin:
    description: All StateCharge admin commands.
    default: op
    children:
      statecharge.admin.off: true
      statecharge.admin.reload: true
  statecharge.admin.off:
    description: Turn off a player's states. /sc admin off <player> [state]
    default: op
  statecharge.admin.reload:
    description: Reload config, language and stored state data.
    default: op
