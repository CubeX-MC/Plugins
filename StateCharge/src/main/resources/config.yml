# StateCharge 配置
# 文档: StateCharge/DESIGN.md
#
# 计费模型:玩家自己 toggle 开关状态,**按实际开启的时长**扣钱。
#   开启 → 开始计费;关闭 → 立刻结算零头并停止。玩家不预购时长。
#   离线不计费,开关状态保留,重新上线接着算。
config-version: 2

# 语言文件: lang/<language>.yml(zh_CN / en_US)
language: zh_CN

timing:
  # 主计时器周期(秒)。开启中的状态按这个粒度累计时长,1 为推荐值(最小 1)。
  tick-seconds: 1

billing:
  # 多久结算一次(秒)。默认 60 —— Vault 调用频率可控,玩家对扣费的感知也够及时。
  # 调小会让扣费更细,但每个开着状态的在线玩家每个周期都要走 Vault:
  # 一次扣款,外加一次入账(economy.account 非空时)。
  interval-seconds: 60
  # 余额保险的默认阈值:结算后余额低于它,自动关掉该玩家全部收费状态。
  # 0 = 默认不设保险。玩家可用 /sc guard <金额> 或交易页里的盾牌按钮自行设置。
  default-guard: 0.0

# 收上来的钱转到哪里去。CubeX 的经济是内循环的:玩家消费掉的钱不该凭空消失,
# 而要转进服务器的银行账户。五种写法(前缀不区分大小写):
#
#   account: ""                                    留空 = 不入账,扣掉的钱直接销毁
#   account: "uuid:11111111-2222-4333-8444-555555555555"
#                                                  按 UUID 精确指定玩家账户(**最稳**)
#   account: "name:cubex_bank"                     名字原样交给 Vault,由经济插件认账户
#   account: "cubex_bank"                          先把名字解析成 UUID 再入账
#   account: "bank:CubeXBank"                      Vault 的 bank 账户(需要经济插件支持 bank)
#
# 三种玩家账户写法怎么选:
#
# - uuid: 没有任何解析,不依赖 profile 缓存,也不会因为改名而漂移。拿得到 UUID 就用它。
# - name: 适合**从不登录的虚拟银行账户**。名字直接进 Vault 的 name 重载,
#         由经济插件用自己的 name↔账户映射去认(EssentialsX / CMI 都有这张表)。
#         代价是插件无从核对钱进了哪个账户 —— 以经济插件的判断为准。
# - 裸名字: 启动时把名字解析成 UUID(在线玩家 → 服务器 profile 缓存 → profile 查询),
#           好处是启动日志会打出**具体哪个账户**收钱,并提示你把 UUID 抄回本配置。
#           在线模式下 profile 查询没查到时,Bukkit 会凭名字**编造**一个离线 UUID ——
#           那是另一个账户,插件会识别出来并拒绝入账,而不是把钱转进幽灵账户。
#
# 账户不可用时插件照常启动、照常扣钱,但每笔扣款都会记一条 WARNING —— 那些钱丢了。
# 修好配置后 /statecharge admin reload 会重新解析,不必重启服务器。
economy:
  account: ""

storage:
  # states.yml 的落盘间隔(秒,最小 5)。崩溃最多丢这一窗口内的计费进度。
  flush-interval-seconds: 60

notifications:
  # 每次周期扣费都发一条聊天提示。默认关闭 —— 按分钟结算的话会把玩家刷屏。
  # 扣款失败与余额保险触发**始终**提示,不受这个开关影响。
  charge-message: false

# 状态定义。每个状态一段;段名即状态 id(用于命令/权限),须匹配 [a-z0-9_-]{1,32}。
# 字段:
#   enabled: true/false            — false 时不出现在交易页,也不能开启
#   display: 展示名                — 缺省用 id;纯文本(颜色由语言文件模板控制,不能含 MiniMessage 标签)
#   price: 每 unit-seconds 的价格  — 0 = 免费(免费状态不扣钱,也不受余额保险影响)
#   unit-seconds: 计费周期长度     — 与 price 合起来构成费率,例如 100/1800 = 每 30 分钟 100 块
#   permission: 权限节点           — 空 = 所有人可见可用;设了则**交易页只对有权限的玩家显示**
#   conflict-group: 互斥组         — 同组状态同时只能开一个;显式 "" 关闭互斥
#   icon: 交易页图标               — Material 名,缺省 NAME_TAG;写错只回退默认值并记一条警告
#   effect: 效果参数
#     type: scale                  — 体型(参数 scale: 0.1..16.0,1.0 为原大小)
#     type: fly                    — 飞行(参数 auto-start: true/false,开启后自动起飞)
states:
  small:
    enabled: true
    display: "变小"
    price: 100.0
    unit-seconds: 1800
    permission: ""
    conflict-group: scale
    icon: RABBIT_FOOT
    effect:
      type: scale
      scale: 0.5
  giant:
    enabled: true
    display: "变大"
    price: 100.0
    unit-seconds: 1800
    permission: ""
    conflict-group: scale
    icon: DRAGON_EGG
    effect:
      type: scale
      scale: 1.6
  fly:
    enabled: true
    display: "飞行"
    price: 200.0
    unit-seconds: 3600
    permission: ""
    conflict-group: fly
    icon: FEATHER
    effect:
      type: fly
      auto-start: true
