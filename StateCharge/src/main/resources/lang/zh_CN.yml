# StateCharge 简体中文语言文件
# 值使用 MiniMessage;<prefix> 会展开为下面的 prefix。
lang-version: 2

prefix: "<gradient:#FFC24B:#FF8A00>StateCharge</gradient> <dark_gray>»</dark_gray> "

messages:
  no-permission: "<prefix><red>你没有权限使用这个命令。</red>"
  player-only: "<prefix><red>该命令只能由玩家执行。</red>"
  help: |-
    <prefix><gold>StateCharge</gold> <gray>— 按开启时长计费的玩家状态</gray>
    <gray>/sc</gray> <dark_gray>打开交易页(开关状态)</dark_gray>
    <gray>/sc list</gray> <dark_gray>查看全部状态与费率</dark_gray>
    <gray>/sc status</gray> <dark_gray>查看自己开着的状态与余额保险</dark_gray>
    <gray>/sc toggle <状态></gray> <dark_gray>开/关一个状态</dark_gray>
    <gray>/sc guard <金额|off></gray> <dark_gray>设置余额保险</dark_gray>

  toggle-on: "<prefix><green>已开启 <white><state></white>。</green><gray>关闭前会持续计费。</gray>"
  toggle-off: "<prefix><yellow>已关闭 <white><state></white>。</yellow><gray>本次结算 <white><price></white>。</gray>"
  toggle-already-on: "<prefix><gray><state> 已经开着了。</gray>"
  toggle-already-off: "<prefix><gray><state> 本来就没开。</gray>"
  toggle-unknown-state: "<prefix><red>未知状态: <state>。用 /sc list 看看有哪些。</red>"
  toggle-disabled: "<prefix><red>状态 <state> 当前不可用。</red>"
  toggle-no-permission: "<prefix><red>你没有权限使用 <state>。</red>"
  toggle-guard-reached: "<prefix><red>余额已低于你设置的保险线,无法开启 <state>。</red>"

  charged: "<prefix><gray>[<state>] 已开启 <white><time></white>,扣费 <gold><price></gold>。</gray>"
  charge-failed: "<prefix><red>扣费失败,<white><state></white> 已自动关闭。</red>"
  guard-triggered: "<prefix><red>余额已低于保险线 <white><threshold></white>,已自动关闭: <yellow><states></yellow></red>"

  guard-prompt: "<prefix><yellow>请在聊天栏输入余额保险金额</yellow><gray>(输入 <white>clear</white> 恢复默认,<white>cancel</white> 取消)</gray>"
  guard-set: "<prefix><green>余额保险已设为 <white><amount></white>。</green><gray>余额低于它时会自动关闭全部收费状态。</gray>"
  guard-reset: "<prefix><green>余额保险已恢复默认 <white><amount></white>。</green>"
  guard-invalid: "<prefix><red>金额无效,请输入一个不小于 0 的数字。</red>"
  guard-cancelled: "<prefix><gray>已取消设置。</gray>"

  admin-player-offline: "<prefix><red>玩家 <player> 不在线;关闭状态需要移除实体效果,只能对在线玩家操作。</red>"
  admin-clear-success: "<prefix><green>已关闭 <player> 的 <count> 个状态。</green>"
  admin-clear-none: "<prefix><yellow><player> 没有开着的状态。</yellow>"
  admin-reload-success: "<prefix><green>重载完成。</green>"
  admin-reload-failed: "<prefix><red>重载失败,出错的阶段: <stage>。详见控制台日志。</red>"

ui:
  list-header: "<prefix><gold>可用的状态:</gold>"
  list-line: "<prefix><dark_gray> - </dark_gray><yellow><id></yellow> <white><state></white><dark_gray>: </dark_gray><gold><price></gold><dark_gray> / </dark_gray><gray><duration></gray>"
  list-empty: "<prefix><gray>当前没有可用的状态。</gray>"

  status-header: "<prefix><gold>你正在开启的状态:</gold>"
  status-line: "<prefix><dark_gray> - </dark_gray><white><state></white><dark_gray> · </dark_gray><gold><price></gold><dark_gray> / </dark_gray><gray><duration></gray>"
  status-empty: "<prefix><gray>你没有开启任何状态。用 /sc 打开交易页。</gray>"
  status-guard: "<prefix><gray>余额保险: <white><amount></white></gray>"

  usage-toggle: "<gray>用法: /sc toggle <状态></gray>"
  usage-on: "<gray>用法: /sc on <状态></gray>"
  usage-off: "<gray>用法: /sc off <状态></gray>"
  usage-guard: "<gray>用法: /sc guard <金额|off></gray>"
  usage-admin-off: "<gray>用法: /sc admin off <玩家> [状态]</gray>"
  usage-admin-reload: "<gray>用法: /sc admin reload</gray>"

  # 时长单位标签,供 durationText 拼装(例如 "1小时30分")。
  time-day: "天"
  time-hour: "小时"
  time-minute: "分"
  time-second: "秒"

  gui-title: "<dark_gray>状态交易</dark_gray>"
  gui-state-on: "<green>● <state></green>"
  gui-state-off: "<gray>○ <state></gray>"
  gui-state-rate: "<gray>费率: <gold><price></gold> / <white><duration></white></gray>"
  gui-state-hint: "<dark_gray>点击开启或关闭</dark_gray>"
  gui-guard-name: "<aqua>余额保险</aqua>"
  gui-guard-current: "<gray>当前: <white><amount></white></gray>"
  gui-guard-hint: "<dark_gray>点击后在聊天栏输入金额</dark_gray>"
