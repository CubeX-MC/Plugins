name: RuleGems dependency security

on:
  pull_request:
    paths:
      - "RuleGems/**"
      - "modules/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
  push:
    branches: [master, main]
    paths:
      - "RuleGems/**"
      - "modules/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=RuleGems/gradle.lockfile
        --config=RuleGems/osv-scanner.toml
      fail-on-vuln: true
      upload-sarif: true

  release-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build RuleGems
        run: ./gradlew :RuleGems:detekt :RuleGems:test :RuleGems:jacocoTestReport :RuleGems:shadowJar --no-daemon
      - name: Reject vulnerable build-only packages in the release JAR
        shell: bash
        run: |
          jar_file="$(find RuleGems/build/libs -maxdepth 1 -name 'RuleGems-*.jar' ! -name '*plain*' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" > "$RUNNER_TEMP/rulegems-jar-entries.txt"
          if grep -Eq '^(com/google/gson/|com/google/common/|org/apache/commons/lang/|org/yaml/snakeyaml/|io/opentelemetry/|org/bouncycastle/|org/junit/|org/bukkit/|org/spigotmc/|io/papermc/paper/|dev/folia/)' "$RUNNER_TEMP/rulegems-jar-entries.txt"; then
            echo "A build-only, compile-only, or server API package entered the release JAR."
            exit 1
          fi
