name: Mirror to plugin repos

# 把 monorepo 各插件子目录 subtree-split 后推送到对应独立 repo 的 main 分支。
# 需要仓库 secret MIRROR_TOKEN(对目标 repo 有 push 权限的 PAT);未配置时优雅跳过。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  mirror:
    name: Subtree-split mirror to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 不持久化 GITHUB_TOKEN 到 git config,否则 push 会用 github-actions[bot]
          # 覆盖掉 URL 里嵌的 MIRROR_TOKEN,导致推送其它 repo 被 403 拒绝。
          persist-credentials: false

      - name: Split and push to plugin main
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::notice::MIRROR_TOKEN 未配置,跳过镜像同步(在仓库 Settings → Secrets 添加后自动生效)。"
            exit 0
          fi

          git config user.name "cubex-mirror-bot"
          git config user.email "actions@users.noreply.github.com"

          # prefix(本地目录) 与 owner/repo 映射
          # 注意:新增插件前必须先建好目标 repo。本脚本是 set -euo pipefail,
          # 对不存在的 repo 执行 git ls-remote 会直接让整个 job 失败。
          # 仍缺镜像 repo 的插件:Reputations。
          prefixes=(BookLite FAWEReplacer MountLicense Contract EcoBalancer RuleGems Metro Railway Clarity Regions)
          repos=(CubeX-MC/BookLite CubeX-MC/FAWEReplace CubeX-MC/MountLicense CubeX-MC/Contract CubeX-MC/EcoBalancer CubeX-MC/RuleGems CubeX-MC/Metro CubeX-MC/Railway CubeX-MC/Clarity CubeX-MC/Regions)

          failed=0
          for i in "${!prefixes[@]}"; do
            p="${prefixes[$i]}"
            repo="${repos[$i]}"
            echo "::group::$p -> $repo (main)"
            sha="$(git subtree split --prefix="$p")"
            url="https://x-access-token:${MIRROR_TOKEN}@github.com/${repo}.git"

            # 独立 repo 偶尔会收到直接提交。分叉时保留双方历史,但让最终文件树
            # 严格等于 monorepo 的 subtree split;整个过程仍是 fast-forward,绝不 force。
            remote_sha="$(git ls-remote "$url" refs/heads/main | awk '{print $1}')"
            push_sha="$sha"
            if [ -n "$remote_sha" ]; then
              remote_ref="refs/remotes/mirror-${i}/main"
              git fetch --no-tags "$url" "refs/heads/main:${remote_ref}"

              if git merge-base --is-ancestor "$remote_sha" "$sha"; then
                push_sha="$sha"
              elif [ "$(git rev-parse "${remote_sha}^{tree}")" = "$(git rev-parse "${sha}^{tree}")" ]; then
                echo "ok: $p 内容已同步(历史分叉,无需推送)@ ${remote_sha}"
                echo "::endgroup::"
                continue
              else
                tree_sha="$(git rev-parse "${sha}^{tree}")"
                push_sha="$(
                  printf 'chore: sync %s from CubeX-Plugins\n' "$p" |
                    git commit-tree "$tree_sha" -p "$remote_sha" -p "$sha"
                )"
                echo "::notice::$p 历史分叉;创建保留双方历史的同步提交 ${push_sha}"
              fi
            fi

            # 仅 fast-forward 推送到 main;失败(如分支保护或并发写入)记录但继续其余。
            if git push "$url" "${push_sha}:refs/heads/main"; then
              echo "ok: $p -> $repo @ ${push_sha} (tree from ${sha})"
            else
              echo "::error::push 失败(可能有并发写入、分支保护或权限不足):$p -> $repo"
              failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::部分镜像同步失败,见上方日志。未做任何 force 推送。"
            exit 1
          fi
